services:
  db:
    image: pgvector/pgvector:pg16
    container_name: jrag-postgres
    restart: always
    environment:
      POSTGRES_DB: jrag
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jrag"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jrag-network

  backend:
    image: ghcr.io/twocold0451/j-rag-backend:latest
    container_name: jrag-backend
    restart: always
    env_file:
      - .env
    volumes:
      - ./logs/backend:/app/logs
    environment:
      SPRING_DATASOURCE_URL: ${DB_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: prod
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - jrag-network

  frontend:
    image: ghcr.io/twocold0451/j-rag-frontend:latest
    container_name: jrag-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - jrag-network

networks:
  jrag-network:
    driver: bridge
