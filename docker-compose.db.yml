services:
  # --- Database Service Only ---
  db:
    image: pgvector/pgvector:pg16
    container_name: jrag-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: jrag
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d jrag"]
      interval: 10s
      timeout: 5s
      retries: 5
